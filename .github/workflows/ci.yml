# Checks every pull request and push to main; on main, also cuts the next release.
#
# `just check` validates the skills, checks the generated manifests are current,
# type-checks and runs the tests: exactly what runs locally.
#
# Every push to main is a release: once the checks pass, the `release` job tags the
# next patch version and publishes a GitHub release. Harnesses that track main get the
# same commit.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: just check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # No lockfile: the tool's inline script metadata pins its dependencies.
          cache-dependency-glob: tools/skills.py
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just
      - run: just check

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One release at a time, in push order.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag the next patch version and publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git tag --points-at "$GITHUB_SHA" | grep -q '^v'; then
            echo "$GITHUB_SHA is already released"; exit 0
          fi
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$latest" ]; then
            next=v0.1.0
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          gh release create "$next" --target "$GITHUB_SHA" --title "$next" --generate-notes
